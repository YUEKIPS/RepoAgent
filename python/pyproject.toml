# 打包使用 setuptools；环境由 conda 管理，二者职责不同。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# 发行包元数据；源码包位于 src/repoagent。
name = "repoagent"
version = "1.1.0"
description = "Evidence-grounded repository analysis"
requires-python = ">=3.12,<3.13"
# 已在本机验证的运行依赖；pytest/Ruff 属于 environment.yml 中的开发工具。
dependencies = [
  "tree-sitter==0.25.2",
  "tree-sitter-java==0.23.5",
  "tree-sitter-go==0.25.0",
  "tree-sitter-c-sharp==0.23.5",
  "tree-sitter-c==0.24.2",
  "tree-sitter-cpp==0.23.4",
  "tree-sitter-rust==0.24.2",
  "tree-sitter-php==0.25.1",
  "tree-sitter-python==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-javascript==0.25.0",
  "pydantic==2.14.3",
  "openai==3.36.1",
  "httpx2==2.16.0",
  "mcp==2.3.0",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
  "tokenizers==0.23.3",
]

[project.scripts]
# 安装后提供 repoagent 命令，等价调用 cli.main。
repoagent = "repoagent.cli:main"

[tool.setuptools.packages.find]
# src 布局避免把测试目录等内容误当成发行包。
where = ["src"]

[tool.setuptools.package-data]
"repoagent.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.txt"]
"repoagent.models" = ["assets/*.json", "assets/*.md"]

[tool.pytest.ini_options]
# 路径相对于本文件所在的 python/ 目录。
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# 检查常见语法/未使用名称问题，并统一 import 顺序；不替代行为测试。
select = ["E4", "E7", "E9", "F", "I"]
